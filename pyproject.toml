[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ovnsuite"
version = "2.0.0"
description = "OVN/OVS lab deployment, diagnostics and teardown"
readme = "README.md"
requires-python = ">=3.9"
# Standard library only, on purpose: this runs on hypervisor hosts where
# adding a pip dependency to the base system is not always welcome, and
# the settings parser is a faithful port of the original awk parser
# rather than a YAML library.
dependencies = []

[project.scripts]
ovnctl = "ovnsuite.cli:main"

[tool.setuptools]
packages = ["ovnsuite", "ovnsuite.commands"]
